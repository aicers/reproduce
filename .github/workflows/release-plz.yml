name: Release-plz

# Releases with release-plz, configured in `release-plz.toml`.
#
# `release` tags `X.Y.Z` and creates the GitHub Release `reproduce X.Y.Z`
# when the commit it runs on is the merge of a release pull request, and
# does nothing otherwise. `release-pr` then opens the release pull
# request, or updates the one that is open, from every commit since the
# last `X.Y.Z` tag.
#
# TRIGGERS: a `workflow_run` of CI on `main`, acting only on a run that
# passed on a push, so nothing here ever runs on a commit CI has not
# passed and nothing here runs CI again. `workflow_dispatch` acts on
# `main`'s head, and only when dispatched on `main`.
#
# Events from GITHUB_TOKEN start no workflow runs. So the release pull
# request gets no checks of its own: no CI and no changelog check run on
# it, and the `title` job below posts its `Validate PR title` status. And
# the tag release-plz pushes starts nothing either: after a release, the
# `upload` job calls `release.yml` to attach the binary, and the `docs`
# job dispatches `docs.yml` to build that release's manual.

on:
  workflow_run:
    # The `name:` of ci.yml, which is what `workflow_run` matches.
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: >-
      ${{
        (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
        || (github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    permissions:
      # Pushes the tag and creates the GitHub Release.
      contents: write
      # Looks up the pull request a commit came from, to tell a release
      # pull request's merge from any other commit.
      pull-requests: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # The commit CI passed on, detached; `main` as checked out on a
      # dispatch. The full history and the tags, from which release-plz
      # finds the last release. No credentials in `.git/config`:
      # release-plz pushes with the token it is given below, and the cargo
      # builds it runs have no use for one.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'refs/heads/main' }}
          fetch-depth: 0
          persist-credentials: false
      - id: sha
        name: Record the commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - id: release-plz
        name: Release
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
          version: 0.4.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The tag `release` created, if any, for the `upload` and `docs` jobs.
      # One package, so at most one release; a tag that is not a plain
      # version fails here rather than reaching them.
      - id: tag
        name: Read the released tag
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          tag="$(jq -r '[(. // [])[] | .tag]
            | if length > 1 then error("more than one release") else (.[0] // "") end' <<< "${RELEASES:-[]}")"
          if [ -z "${tag}" ]; then
            echo "No release: this commit is not a release pull request's merge."
            exit 0
          fi
          if [[ ! "${tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release-plz released a tag that is not a version such as 1.2.3."
            exit 1
          fi
          echo "Released ${tag}."
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  release-pr:
    name: Release PR
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # Pushes the release branch.
      contents: write
      # Opens, updates or closes the release pull request.
      pull-requests: write
    outputs:
      created: ${{ steps.release-plz.outputs.prs_created }}
      pr: ${{ steps.release-plz.outputs.pr }}
    steps:
      # release-pr refuses a detached HEAD and takes the release pull
      # request's base from the checked-out branch, so this is the branch
      # `main`, not the commit `release` ran on.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # Only while the commit `release` ran on is still `main`'s head. A
      # run for a commit `main` has since moved past would rebuild the
      # release pull request from stale history; the run for the newer
      # commit, queued behind this one, does it instead.
      - id: head
        name: Check that the commit is still main's head
        env:
          EXPECTED: ${{ needs.release.outputs.sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ -z "${EXPECTED}" ]; then
            echo "::error::The release job did not report the commit it ran on."
            exit 1
          fi
          if [ "${head}" = "${EXPECTED}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping release-pr: this run is for ${EXPECTED}, but main's head is now ${head}."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust
        if: ${{ steps.head.outputs.current == 'true' }}
        uses: dtolnay/rust-toolchain@stable
      - id: release-plz
        name: Release PR
        if: ${{ steps.head.outputs.current == 'true' }}
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
          version: 0.4.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The release pull request starts no workflow, so `pr-title.yml` never
  # checks it. This posts the same check as a commit status of the same
  # name on its head, which is what the required check reads.
  title:
    name: Check release PR title
    needs: release-pr
    if: ${{ needs.release-pr.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # The checkout, which holds the pin the rule is read at.
      contents: read
      # Reads the release pull request's title and head.
      pull-requests: read
      # Posts `Validate PR title`.
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - id: pr
        name: Read the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ fromJSON(needs.release-pr.outputs.pr).number }}
        run: |
          set -euo pipefail
          case "${NUMBER}" in
            '' | *[!0-9]*)
              echo "::error::release-plz reported no release pull request number."
              exit 1
              ;;
          esac
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}")"
          sha="$(jq -r .head.sha <<< "${pr}")"
          case "${sha}" in
            *[!0-9a-f]* | '')
              echo "::error::Could not read the head of pull request ${NUMBER}."
              exit 1
              ;;
          esac
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          # A title is one line; the check below fails one holding a line
          # break, so a JSON string is written as an output safely.
          echo "title=$(jq -c .title <<< "${pr}")" >> "$GITHUB_OUTPUT"
      - id: check
        name: Check the title
        continue-on-error: true
        uses: aicers/agent-instructions/conventional-title@main
        with:
          title: ${{ fromJSON(steps.pr.outputs.title) }}
      - name: Post Validate PR title
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
          OUTCOME: ${{ steps.check.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "${OUTCOME}" = "success" ]; then
            state=success
            description="The title is a Conventional title"
          else
            state=failure
            description="The title is not a Conventional title"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="${state}" \
            -f context="Validate PR title" \
            -f description="${description}" \
            -f target_url="${RUN_URL}" > /dev/null
          echo "Posted Validate PR title: ${state} on ${SHA}"
          [ "${state}" = "success" ]

  # Builds the binary at the new tag and uploads it to the Release
  # `release` created. The tag push started no workflow, so this is the
  # only way the binary gets there.
  upload:
    name: Upload binary
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    # A called workflow's jobs get no more than this job grants:
    # `contents: write` to upload the asset.
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  # Builds the new release's manual and uploads it as `docs-site-X.Y.Z`,
  # through the rebuild path `docs.yml` documents: dispatched on `main`
  # with its `tag` input, it checks out the tag.
  docs:
    name: Build release manual
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      # Dispatches `docs.yml`.
      actions: write
    steps:
      - name: Dispatch the Docs workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run docs.yml --repo "${GITHUB_REPOSITORY}" --ref main -f tag="${TAG}"
          echo "Dispatched docs.yml on main with tag ${TAG}."
