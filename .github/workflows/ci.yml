name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-dispatch' || (github.run_attempt != '1' && format('-rerun-{0}', github.run_id) || '') }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change Filter
    runs-on: ubuntu-latest
    # The filter only reads the checked-out history.
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs-only }}
    steps:
      # The full history, because the action diffs locally and does not
      # fetch: a pull request against its merge-base with the base branch,
      # a push to `main` against `github.event.before`, and a dispatched
      # branch against its merge-base with `main`.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # `docs-paths` lists the inert files, on top of the action's built-in
      # list (`*.md`, `LICENSE`, `.agent-instructions.toml`,
      # `.markdownlint*`), the shared-instructions pin among them: it
      # changes no build or test, and the ungated drift step checks it.
      # `not-docs-paths` names what a build or a test reads, and wins over
      # `docs-paths`.
      #
      # Docs-only requires every changed path to be on `docs-paths` or the
      # built-in list and none on `not-docs-paths`, so a `.md` under `src/`
      # is code. A path on neither list counts as code: a `.gitignore` edit
      # next to a README edit runs every Rust job. Anything the action
      # cannot establish also lands on false.
      - id: scope
        uses: aicers/agent-instructions/change-scope@main
        with:
          docs-paths: |
            docs/**
            **/*.md
            mkdocs.yml
            .markdownlint*
            .agent-instructions.toml
          not-docs-paths: |
            src/**
            tests/**
            scripts/**
            Cargo.toml
            Cargo.lock
            .clippy.toml
            .github/workflows/**

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    # Read-only, as in the other consumers of aicers/agent-instructions.
    # Nothing here writes: the lint reads the Markdown, and the drift check
    # reads the pin and the upstream release.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        id: checkout
      # No `globs` input. The `globs` and `ignores` of the root
      # `.markdownlint-cli2.yaml` are the one place that decides which files
      # are linted, here and in a local bare `markdownlint-cli2` alike. The
      # action's default `*.{md,markdown}` is only added to them and changes
      # nothing.
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25

      # Fails when this repository's copy of the shared instruction blocks
      # stops matching the release `.agent-instructions.toml` pins --
      # because a generated region of AGENTS.md was edited here, or because
      # an update pull request was never merged.
      #
      # It belongs in THIS job and nowhere below, because it must not
      # inherit the `docs_only` gate. `changes` counts `**/*.md` as docs and
      # AGENTS.md is a `.md` file, so a change that edits only a generated
      # region is docs-only by that reckoning -- a gated step would skip the
      # check on precisely the changes that cause drift. `markdown` is
      # ungated, and is already the job that concerns itself with this
      # class of file.
      #
      # `@main`: the scripts are mechanism and come from wherever this
      # reference points, while the blocks are content and come from the
      # pin. No `with:` block, because the release to compare against and
      # the blocks to compare are both read from that one file.
      #
      # Guarded rather than left to the default `success()`, which would
      # skip it whenever the lint above failed. The two checks are
      # independent -- a drifted block is drift whether or not some other
      # Markdown file also breaks a lint rule. `!cancelled()` rather than
      # `always()`, because a cancelled run should stop. The `checkout`
      # clause keeps a failed checkout from being reported as drift: the
      # action fails outright when it cannot read the pin file, and in an
      # empty workspace that message names the pin for a problem that is
      # not the pin's.
      - name: Check shared instruction-block drift
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: aicers/agent-instructions/check-drift@main

  # Fail closed, as in `test`, `journal-systemd` and `coverage`. A bare
  # `docs_only != 'true'` lets a *failing* `changes` job skip its
  # dependants, and GitHub counts a skipped required check as a pass -- so
  # a broken filter would wave an untested change through. `!cancelled()`
  # runs the job whenever the filter did not positively report docs-only,
  # a failed filter included.
  check:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      # Three retries and a step timeout, since the 2026-11-11 Ubuntu archive
      # outage: the image sets `Acquire::Retries "1"`, and an unreachable
      # archive otherwise fails the step at once or stalls it until the
      # job's own timeout. 10 minutes is 3x the longest of the last 20
      # successful runs of this step, at the 10-minute minimum.
      - name: Install libraries
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=3 install libhyperscan-dev libpcap-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/checkout@v5
      - name: Check formatting
        run: cargo fmt -- --check --config group_imports=StdExternalCrate
      - name: Clippy
        run: cargo clippy --tests -- -D warnings
      - name: Detect Cargo.lock changes
        run: git diff-index --quiet HEAD --

  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      # Three retries and a step timeout, since the 2026-11-11 Ubuntu archive
      # outage: the image sets `Acquire::Retries "1"`, and an unreachable
      # archive otherwise fails the step at once or stalls it until the
      # job's own timeout. 10 minutes is 3x the longest of the last 20
      # successful runs of this step, at the 10-minute minimum.
      - name: Install libraries
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=3 install libhyperscan-dev libpcap-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/checkout@v5
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  journal-systemd:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    steps:
      # Three retries and a step timeout, since the 2026-11-11 Ubuntu archive
      # outage: the image sets `Acquire::Retries "1"`, and an unreachable
      # archive otherwise fails the step at once or stalls it until the
      # job's own timeout. 10 minutes is 3x the longest of the last 20
      # successful runs of this step, at the 10-minute minimum.
      - name: Install libraries
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=3 install libhyperscan-dev libpcap-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v5
      - name: Ensure a persistent journal
        run: |
          sudo mkdir -p /var/log/journal
          sudo systemd-tmpfiles --create --prefix /var/log/journal
          sudo journalctl --flush
      - name: Create the unit's system user
        run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin \
            clumit-security-reproduce-test
      - name: Run the systemd integration test
        env:
          JOURNAL_TEST_USER: clumit-security-reproduce-test
        run: cargo test --test journal_systemd -- --ignored --test-threads=1 --show-output

  coverage:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      # Three retries and a step timeout, since the 2026-11-11 Ubuntu archive
      # outage: the image sets `Acquire::Retries "1"`, and an unreachable
      # archive otherwise fails the step at once or stalls it until the
      # job's own timeout. 10 minutes is 3x the longest of the last 20
      # successful runs of this step, at the 10-minute minimum.
      - name: Install libraries
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=3 install libhyperscan-dev libpcap-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/checkout@v5
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          fail_ci_if_error: true

  # `always()`, deliberately, and not `!cancelled()`: a cancelled run would
  # otherwise skip this job, and GitHub counts a skipped required check as a
  # pass. Running through cancellation lets the assertions below see the
  # cancelled results and report red. It needs every other job, so it is
  # the one check branch protection has to name.
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    permissions: {}
    needs: [changes, markdown, check, test, journal-systemd, coverage]
    if: ${{ always() }}
    steps:
      # A filter that errored is a defect, not a tolerable outcome. The gated
      # jobs did still run -- their `if:` fails closed -- but the breakage has
      # to be visible rather than absorbed.
      - name: Assert the change filter succeeded
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "Change Filter: ${{ needs.changes.result }}" >&2
          exit 1

      # `skipped` is a pass here, and only here: it is what a gated job
      # reports on a docs-only change. `cancelled` is not.
      - name: Assert every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${RESULTS}"
          bad="$(printf '%s' "${RESULTS}" \
            | jq -r 'to_entries[]
                     | select(.value.result != "success" and .value.result != "skipped")
                     | "  \(.key): \(.value.result)"')"
          if [ -n "${bad}" ]; then
            echo "Not green:" >&2
            echo "${bad}" >&2
            exit 1
          fi
