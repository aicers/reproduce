version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    ignore:
      - dependency-name: "giganto-client"
    schedule:
      interval: "daily"
    # `chore(deps): ...`, a Conventional title, which release-plz files
    # under Other.
    commit-message:
      prefix: "chore"
      include: "scope"
