cert = "tests/cert.pem"
key = "tests/key.pem"
ca_certs = ["tests/root.pem"]
giganto_ingest_srv_addr = "127.0.0.1:38370"
giganto_name = "aicers"
kind = "http"
input = "/path/to/file_or_directory"
report = false

[file]
import_from_giganto = true
polling_mode = false
transfer_count = 0
transfer_skip_count = 0
last_transfer_line_suffix = "bck"

[directory]
file_prefix = "http"
polling_mode = false
