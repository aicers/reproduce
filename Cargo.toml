[package]
name = "reproduce"
version = "0.27.0"
edition = "2024"

[lib]
name = "reproduce"
path = "src/lib.rs"

[[bin]]
name = "reproduce"
path = "src/bin/reproduce/main.rs"

[features]
default = ["netflow"]
netflow = ["dep:pcap"]

[dependencies]
async-trait = "0.1"
anyhow = "1"
base64 = "0.23"
bincode = "1"
byteorder = "1"
bytesize = "2"
config = { version = "0.15", features = ["toml"], default-features = false }
csv = "1"
giganto-client = { git = "https://github.com/aicers/giganto-client.git", rev = "7c0baab56f8226e9cd43e110e028c12330be3d6d" }
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
num-traits = "0.2"
num_enum = "0.7"
pcap = { version = "2", optional = true }
quinn = { version = "0.11", default-features = false, features = [
    "platform-verifier",
    "runtime-tokio",
    "rustls-aws-lc-rs",
    "bloom",
    "log",
] }
rayon = "1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "native-tls",
] }
review-protocol = { git = "https://github.com/aicers/review-protocol.git", tag = "0.23.0", features = [
    "client",
] }
rustls = { version = "0.23.46", default-features = false, features = [
    "aws_lc_rs",
    "prefer-post-quantum",
    "std",
] }
rustls-pemfile = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = "0.28"
strum_macros = "0.28"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

[dev-dependencies]
chrono = "0.4"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = [
    "aws_lc_rs",
    "pem",
    "x509-parser",
] }
review-protocol = { git = "https://github.com/aicers/review-protocol.git", tag = "0.23.0", features = [
    "server",
] }

[[test]]
name = "journal_output"
path = "tests/journal_output.rs"
harness = false

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
